[package]
name = "rblxa"
version = "1.0.0"
edition = "2021"
description = "Windows-only TOML-like Roblox Place authoring compiler"
license = "MIT"

[package.metadata.rblxa]
platform = "windows"
target = "x86_64-pc-windows-msvc"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
toml = "0.9.8"
rblx_binary = { package = "rbx_binary", version = "3.0.0" }
rblx_dom = { package = "rbx_dom_weak", version = "4.2.0" }
rblx_types = { package = "rbx_types", version = "3.1.0" }


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
